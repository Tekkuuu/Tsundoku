name: omm
services:
  app:
    image: ghcr.io/tekkuuu/onemoremanga:latest
    container_name: omm
    ports:
      - '3000:3000'
    environment:
      ORIGIN: 'https://omm.example.com'
      DATABASE_URL: 'postgres://omm:omm@db:5432/omm'
      BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET}'
      MAX_USERS: '1'
      LOG_LEVEL: 'info'
      # Uploads (covers, receipts).
      DATA_DIR: '/data'
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: omm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: omm
      POSTGRES_PASSWORD: omm
      POSTGRES_DB: omm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omm -d omm']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  appdata:
